name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 and LuaRocks
        run: sudo apt-get install -y lua5.1 lua5.1-dev luarocks

      - name: Install busted
        run: sudo luarocks --lua-version=5.1 install busted

      - name: Run tests
        run: busted tests/
